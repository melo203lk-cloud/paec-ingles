 o:[["Laugh and forward it.","Reírte y reenviarla."],["Say it is not okay, do not share it and check on the classmate.","Decir que no está bien, no compartirla y preguntarle al compañero cómo está."],["Say nothing and leave the chat.","No decir nada y salir del chat."]],b:1,
 e:["Not sharing protects the classmate’s dignity. Speaking up kindly shows that others can stop this behavior too.","No compartirla protege la dignidad del compañero. Hablar con amabilidad muestra que los demás también pueden frenar esa conducta."]},
{s:["You disagree with a teammate about a project.","Estás en desacuerdo con un compañero de equipo sobre un proyecto."],
 o:[["Listen to his reasons, then explain yours.","Escuchar sus razones y luego explicar las tuyas."],["Do the work alone without telling him.","Hacer el trabajo solo sin avisarle."],["Raise your voice until he agrees.","Subir la voz hasta que acepte."]],b:0,
 e:["Dialogue lets both people feel heard. You can disagree and still respect each other.","El diálogo permite que ambos se sientan escuchados. Se puede no estar de acuerdo y aun así respetarse."]},
{s:["A friend seems sad and avoids everyone.","Una amiga se ve triste y evita a todos."],
 o:[["Tell her to stop being dramatic.","Decirle que deje de exagerar."],["Ask privately how she is and listen without judging.","Preguntarle en privado cómo está y escucharla sin juzgar."],["Wait; it will pass.","Esperar; ya se le pasará."]],b:1,
 e:["A private, gentle question shows care. If she needs more help, you can encourage her to talk to a trusted adult.","Una pregunta privada y amable muestra cuidado. Si necesita más ayuda, puedes animarla a hablar con un adulto de confianza."]},
{s:["Someone in class has a different opinion from yours and others laugh at him.","Alguien en clase tiene una opinión distinta a la tuya y otros se burlan de él."],
 o:[["Join the laughter to fit in.","Unirte a las risas para encajar."],["Say that respecting opinions matters, even if you disagree.","Decir que respetar las opiniones importa, aunque no estés de acuerdo."],["Tell him he is wrong in front of everyone.","Decirle frente a todos que está equivocado."]],b:1,
 e:["Understanding is not agreeing. You can disagree with an idea while protecting the person from humiliation.","Comprender no es estar de acuerdo. Puedes discrepar de una idea y proteger a la persona de la humillación."]}];
const GLOSS=[
["Empathy","Empatía","Understanding what another person feels or thinks.","Comprender lo que otra persona siente o piensa."],
["Compassion","Compasión","Understanding someone’s pain and wanting to help.","Comprender el dolor de alguien y querer ayudar."],
["Respect","Respeto","Treating people with dignity, including when we disagree.","Tratar a las personas con dignidad, incluso cuando no coincidimos."],
["Tolerance","Tolerancia","Accepting that others may think or live differently.","Aceptar que otras personas pueden pensar o vivir de manera diferente."],
["Bullying","Acoso escolar","Repeated aggression or humiliation between students.","Agresión o humillación repetida entre estudiantes."],
["Discrimination","Discriminación","Unfair treatment of people because of who they are.","Trato injusto hacia las personas por lo que son."],
["Cooperation","Cooperación","Working together toward a common goal.","Trabajar juntos para lograr un objetivo común."],
["Awareness","Conciencia","Knowing and noticing a problem or another person’s situation.","Conocer y darse cuenta de un problema o de la situación de otra persona."],
["Conflict","Conflicto","A disagreement that can be solved peacefully through dialogue.","Un desacuerdo que puede resolverse de forma pacífica mediante el diálogo."],
["Peaceful","Pacífico","Calm and respectful, without violence.","Tranquilo y respetuoso, sin violencia."]];
const TEAM=["Álvarez Camarillo, Kevin Elian","Camacho Ampudia, Sebastián Bosco","Castillo Vargas, Rafael Leonardo","Daza Silva, Roberto","Martínez Rojas, Diego","Vega Escandón, Juan Pablo"];
/* APA 7 references: [prefix, italic title, URL]; years follow the printed article */
const REFS=[
["INEGI. (2022). ","Encuesta Nacional sobre la Dinámica de las Relaciones en los Hogares (ENDIREH) 2021","https://www.inegi.org.mx/programas/endireh/2021/"],
["INEGI. (2023). ","Encuesta Nacional sobre Discriminación (ENADIS) 2022","https://www.inegi.org.mx/programas/enadis/2022/"],
["INEGI. (2025). ","Módulo sobre Ciberacoso (MOCIBA) 2024","https://www.inegi.org.mx/programas/mociba/2024/"],
["UNESCO. (2023). ","Recommendation on education for peace and human rights, international understanding, cooperation, fundamental freedoms, global citizenship and sustainable development","https://www.unesco.org/en/legal-affairs/recommendation-education-peace-and-human-rights-international-understanding-cooperation-fundamental"],
["UNESCO. (2024). ","Mainstreaming social and emotional learning in education systems: Policy guide","https://www.unesco.org/en/articles/mainstreaming-social-and-emotional-learning-education-systems-policy-guide"],
["UNICEF México. (n.d.). ","Protección contra la violencia","https://www.unicef.org/mexico/proteccion-contra-la-violencia"],
["UNICEF México. (2019, July 30). ","Erradicar la violencia en el entorno escolar","https://www.unicef.org/mexico/historias/erradicar%20la%20violencia%20en%20el%20entorno%20escolar"]];

/* ===== Rendering ===== */
let L=0; // 0 = English, 1 = Spanish
try{L=localStorage.getItem("lang")==="es"?1:0}catch(e){}
const $=id=>document.getElementById(id);
const card=(h,p)=>`<article class="card"><h3>${h}</h3><p>${p}</p></article>`;
let answers={}; // quiz answers by index

function render(){
 document.documentElement.lang=L?"es":"en";
 $("lang").textContent=L?"ENGLISH":"ESPAÑOL";
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[el.dataset.t][L]);
 const bi=(a,i)=>a[L]; // pick language from a [en,es] pair
 $("types").innerHTML=TYPES.map(t=>card(t[L],t[2+L])).join("");
 $("diff").innerHTML=DIFF.map(t=>card(t[L],t[2+L])).join("");
 $("dims").innerHTML=DIMS.map(t=>card(t[L],t[2+L])).join("");
 $("sits").innerHTML=SITS.map(t=>card(t[L],t[2+L])).join("");
 $("pillars").innerHTML=PILLARS.map(t=>card(t[L],"")).join("").replace(/<p><\/p>/g,"");
 $("tips").innerHTML=TIPS.map((t,i)=>card((i+1)+". "+t[L],t[2+L])).join("");
 $("gloss").innerHTML=GLOSS.map(t=>`<article class="card"><h3>${t[L]} <small style="color:#4a5a6a;font-weight:400">— ${t[1-L]}</small></h3><p>${t[2+L]}</p></article>`).join("");
 $("team").innerHTML=TEAM.map(n=>`<div class="card">${n}</div>`).join("");
 $("reflist").innerHTML=REFS.map(r=>`<li>${r[0]}<em>${r[1]}</em>. <a href="${r[2]}" target="_blank" rel="noopener">${r[2]}</a></li>`).join("");
 $("stats").innerHTML=STATS.map(s=>`<div class="stat"><h3>${s.h[L]}</h3><small>${T.pop[L]}: ${s.p[L]}</small>`+
  s.r.map(r=>`<div class="row"><span class="l">${r[0]}</span><div class="track" role="img" aria-label="${r[1]}%"><div class="fill" data-w="${r[1]}"></div></div><b>${r[1]}%</b></div>`).join("")+
  `<p style="margin:10px 0 4px">${s.n[L]}</p><a href="${s.u}" target="_blank" rel="noopener">${T.more[L]}: ${s.u.replace("https://","")}</a></div>`).join("");
 grow();
 renderQuiz();
}
/* Bars are drawn on a 0–100% scale so proportions are not distorted */
function grow(){requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"),60))}

function renderQuiz(){
 $("quiz").innerHTML=QUIZ.map((q,i)=>{
  const a=answers[i], done=a!==undefined;
  return `<div class="card" style="margin-bottom:16px"><h3>${i+1}. ${q.s[L]}</h3>`+
   q.o.map((o,j)=>`<button class="opt${done&&j===q.b?" best":""}${done&&j===a?" pick":""}" ${done?"disabled":""} onclick="pick(${i},${j})">${o[L]}</button>`).join("")+
   `<div class="fb" style="display:${done?"block":"none"}"><b>${done?(a===q.b?(L?"¡Buena elección! ":"Great choice! "):(L?"Otra opción ayuda más. ":"Another option helps more. ")):""}</b>${q.e[L]}</div></div>`;
 }).join("");
}
function pick(i,j){answers[i]=j;renderQuiz()}

$("lang").onclick=()=>{L=1-L;try{localStorage.setItem("lang",L?"es":"en")}catch(e){}render()};
$("menuBtn").onclick=()=>{const n=$("nav"),o=n.classList.toggle("open");$("menuBtn").setAttribute("aria-expanded",o)};
$("nav").onclick=e=>{if(e.target.tagName==="A")$("nav").classList.remove("open")};
render();
</script>
</body>
